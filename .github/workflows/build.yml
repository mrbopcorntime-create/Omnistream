name: Build OmniStream APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get Moonlight streaming engine (pinned)
        run: |
          git clone https://github.com/moonlight-stream/moonlight-android engine
          cd engine
          git checkout b48494c
          git submodule update --init --recursive --depth 1

      - name: Merge OmniStream into the engine
        run: python3 integrate.py

      - name: Build APK
        run: |
          cd engine
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRootRelease
          cp $(find app/build/outputs/apk/nonRoot/release -name '*.apk' | head -1) ../OmniStream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OmniStream-apk
          path: OmniStream.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OmniStream build ${{ github.run_number }}
          files: OmniStream.apk
